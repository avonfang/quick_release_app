<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=375, initial-scale=1.0"><title>A-沉浸式对话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;background:#1a1a2e}
.phone{width:375px;height:740px;background:#2A231D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
.nav{display:flex;align-items:center;padding:44px 16px 12px;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-back{color:#C4A06A;font-size:16px}
.nav-title{flex:1;text-align:center;color:#E8DFD0;font-size:15px;font-weight:600;letter-spacing:2px}
.nav-empty{width:32px}
.msgs{flex:1;padding:24px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.ai-msg{display:flex;gap:10px;max-width:90%}
.ai-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#C69C6D,#B8885A);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;margin-top:2px}
.ai-bubble{background:rgba(255,255,255,0.08);border-radius:4px 16px 16px 16px;padding:14px 18px;line-height:1.8;color:#FDFBF7;font-size:14px;letter-spacing:0.5px}
.user-msg{display:flex;justify-content:flex-end}
.user-bubble{background:linear-gradient(135deg,#C69C6D,#B8885A);border-radius:16px 4px 16px 16px;padding:12px 18px;color:#fff;font-size:14px;max-width:80%;line-height:1.7}
.ai-msg.short .ai-bubble{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);font-size:12px;text-align:center;border-radius:12px;min-width:200px}
.input-area{display:flex;align-items:flex-end;gap:10px;padding:10px 14px;padding-bottom:24px;border-top:1px solid rgba(255,255,255,0.06);background:#2A231D}
.input-wrap{flex:1;background:rgba(255,255,255,0.08);border-radius:16px;padding:12px 16px}
.input{color:#FDFBF7;font-size:14px;outline:none;border:none;background:transparent;width:100%;resize:none;font-family:inherit;line-height:1.6}
.input::placeholder{color:rgba(255,255,255,0.25)}
.send-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#C69C6D,#B8885A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
</style></head>
<body><div class="phone">
<div class="nav"><span class="nav-back">←</span><span class="nav-title">一次觉察</span><span class="nav-empty"></span></div>
<div class="msgs">
<div class="ai-msg"><div class="ai-avatar">AI</div><div class="ai-bubble">今晚有什么在你心里留下了痕迹？可以跟我说说。</div></div>
<div class="user-msg"><div class="user-bubble">今天下午开会时被领导当众批评了，心里一直堵着。</div></div>
<div class="ai-msg"><div class="ai-avatar">AI</div><div class="ai-bubble">我听到了。被当众批评那种感觉确实很不好受。<br><br>当时你心里冒出来的第一个念头是什么？</div></div>
<div class="user-msg"><div class="user-bubble">就觉得我很差劲，什么都做不好。</div></div>
<div class="ai-msg"><div class="ai-avatar">AI</div><div class="ai-bubble">"我很差劲，什么都做不好"——这句话背后，似乎藏着一个你一直相信的信念。你能感觉到吗？</div></div>
</div>
<div class="input-area"><div class="input-wrap"><div class="input" contenteditable="true">好像是的...</div></div><div class="send-btn">⟶</div></div>
</div></body></html>
