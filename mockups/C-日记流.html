<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=375, initial-scale=1.0"><title>C-日记流</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;background:#1a1a2e}
.phone{width:375px;height:740px;background:#2A231D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
.nav{display:flex;align-items:center;padding:44px 16px 12px;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-back{color:#C4A06A;font-size:16px}
.nav-title{flex:1;text-align:center;color:#E8DFD0;font-size:15px;font-weight:600;letter-spacing:2px}
.nav-empty{width:32px}
/* timeline scroll */
.timeline{flex:1;overflow-y:auto;padding:20px 20px 40px;position:relative}
/* vertical line */
.timeline::before{content:'';position:absolute;left:35px;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.08)}
.entry{margin-bottom:28px;position:relative;padding-left:52px}
.entry.active .entry-content{border-color:#C69C6D}
.entry-dot{position:absolute;left:31px;top:4px;width:9px;height:9px;border-radius:50%;background:#2A231D;border:2px solid rgba(255,255,255,0.2);z-index:1}
.entry.done .entry-dot{background:#C69C6D;border-color:#C69C6D}
.entry.active .entry-dot{background:#2A231D;border:2px solid #C69C6D;box-shadow:0 0 0 3px rgba(198,156,109,0.15)}
.entry-label{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:3px;margin-bottom:8px}
.entry.active .entry-label{color:#C69C6D}
.entry-content{border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px 16px;background:rgba(255,255,255,0.03)}
.entry.done .entry-content{border-color:rgba(255,255,255,0.04);background:transparent}
.entry-guide{font-size:13px;color:rgba(255,255,255,0.5);line-height:1.7;margin-bottom:8px}
.entry.done .entry-guide{font-size:12px;color:rgba(255,255,255,0.25);margin-bottom:2px}
.entry-answer{font-size:13px;color:#FDFBF7;line-height:1.7}
.entry.done .entry-answer{font-size:13px;color:rgba(255,255,255,0.45)}
.entry-input{width:100%;background:transparent;border:none;color:#FDFBF7;font-size:13px;outline:none;resize:none;font-family:inherit;line-height:1.7;min-height:60px}
.entry-input::placeholder{color:rgba(255,255,255,0.2)}
.entry.active .entry-content{background:rgba(255,255,255,0.05)}
</style></head>
<body><div class="phone">
<div class="nav"><span class="nav-back">←</span><span class="nav-title">一次觉察</span><span class="nav-empty"></span></div>
<div class="timeline">
<div class="entry done">
<div class="entry-dot"></div>
<div class="entry-label">事 件</div>
<div class="entry-content">
<div class="entry-guide">今晚有什么在你心里留下了痕迹？</div>
<div class="entry-answer">今天下午开会时被领导当众批评了。</div>
</div>
</div>
<div class="entry done">
<div class="entry-dot"></div>
<div class="entry-label">情 绪</div>
<div class="entry-content">
<div class="entry-guide">那是什么样的感觉？</div>
<div class="entry-answer">委屈、愤怒，还有一种深深的无力感。</div>
</div>
</div>
<div class="entry active">
<div class="entry-dot"></div>
<div class="entry-label">自 动 想 法</div>
<div class="entry-content">
<div class="entry-guide">当时心里冒出的第一个念头是？</div>
<textarea class="entry-input" placeholder="写下那个念头...">我真的很差劲，什么都做不好。</textarea>
</div>
</div>
<div class="entry">
<div class="entry-dot"></div>
<div class="entry-label">信 念</div>
<div class="entry-content">
<div class="entry-guide" style="color:rgba(255,255,255,0.15)">完成上一步后展开</div>
</div>
</div>
</div>
</div></body></html>
