<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=375, initial-scale=1.0"><title>E-流式输出</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;background:#1a1a2e}
.phone{width:375px;height:740px;background:#2A231D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:44px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-back{color:#C4A06A;font-size:15px}
.nav-title{font-size:15px;color:#E8DFD0;font-weight:600;letter-spacing:2px}
.nav-step{font-size:11px;color:rgba(255,255,255,0.3)}
/* progress */
.progress{display:flex;justify-content:center;gap:8px;padding:12px 0}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.1)}
.dot.done{background:#C69C6D;opacity:0.5}
.dot.active{background:#C69C6D;box-shadow:0 0 0 4px rgba(198,156,109,0.2)}
/* chat area */
.chat{flex:1;overflow-y:auto;padding:16px 20px 0}
/* user bubble */
.msg-user{display:flex;justify-content:flex-end;margin-bottom:20px}
.bubble-user{background:linear-gradient(135deg,#C69C6D,#B8885A);border-radius:16px 4px 16px 16px;padding:12px 18px;max-width:280px}
.bubble-user text{font-size:14px;color:#fff;line-height:1.7}
/* typing label */
.typing-label{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-left:4px}
.typing-label text{font-size:10px;color:#C69C6D;letter-spacing:2px}
.typing-dot-sm{width:5px;height:5px;border-radius:50%;background:#C69C6D;animation:blink 0.6s ease-in-out infinite}
.typing-dot-sm:nth-child(2){animation-delay:0.15s}
.typing-dot-sm:nth-child(3){animation-delay:0.3s}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}
/* AI bubble - streaming */
.msg-ai{margin-bottom:20px}
.bubble-ai{background:rgba(255,255,255,0.06);border-radius:4px 16px 16px 16px;padding:14px 18px;display:inline-block;max-width:300px}
.ai-text{font-size:14px;color:#FDFBF7;line-height:1.8}
.ai-cursor{display:inline-block;width:2px;height:16px;background:#C69C6D;vertical-align:text-bottom;margin-left:2px;animation:blink 0.6s ease-in-out infinite}
/* input area */
.input-area{flex-shrink:0;padding:12px 16px 20px;border-top:1px solid rgba(255,255,255,0.06)}
.input-wrap{display:flex;align-items:flex-end;gap:10px;background:rgba(255,255,255,0.06);border-radius:20px;padding:10px 16px}
.input-field{flex:1;background:transparent;border:none;color:#FDFBF7;font-size:14px;outline:none;font-family:inherit;min-height:22px;line-height:1.5}
.input-field::placeholder{color:rgba(255,255,255,0.2)}
.send-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#C69C6D,#B8885A);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
</style></head>
<body><div class="phone">
<div class="nav">
<span class="nav-back">← 返回</span>
<span class="nav-title">一次觉察</span>
<span class="nav-step">3/8</span>
</div>
<div class="progress">
<span class="dot done"></span><span class="dot done"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
</div>
<div class="chat">
  <!-- First exchange - complete -->
  <div class="msg-ai">
    <div class="bubble-ai"><span class="ai-text">此刻有什么想说的吗？你现在感觉怎么样？</span></div>
  </div>
  <div class="msg-user">
    <div class="bubble-user"><span>今天开会又被领导批评了，心里很难受。</span></div>
  </div>
  <!-- Second exchange - complete -->
  <div class="msg-ai">
    <div class="bubble-ai"><span class="ai-text">我听到了。那种"又被批评"的感觉，让你想到什么？</span></div>
  </div>
  <div class="msg-user">
    <div class="bubble-user"><span>觉得自己很差劲，什么都做不好。</span></div>
  </div>
  <!-- Third - streaming now -->
  <div class="msg-ai">
    <div class="typing-label">
      <span class="typing-dot-sm"></span><span class="typing-dot-sm"></span><span class="typing-dot-sm"></span>
      <text>正在回复...</text>
    </div>
    <div class="bubble-ai">
      <span class="ai-text">我感受到了。你说"什么都做不好"的时候，身体有什么感觉吗？</span><span class="ai-cursor"></span>
    </div>
  </div>
</div>
<div class="input-area">
  <div class="input-wrap">
    <span class="send-btn" style="opacity:0.3">↑</span>
  </div>
</div>
</div></body></html>
