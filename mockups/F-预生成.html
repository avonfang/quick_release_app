<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=375, initial-scale=1.0"><title>F-预生成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;background:#1a1a2e}
.phone{width:375px;height:740px;background:#2A231D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
.nav{display:flex;align-items:center;justify-content:space-between;padding:44px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-back{color:#C4A06A;font-size:15px}
.nav-title{font-size:15px;color:#E8DFD0;font-weight:600;letter-spacing:2px}
.nav-step{font-size:11px;color:rgba(255,255,255,0.35)}
.progress{display:flex;justify-content:center;gap:8px;padding:12px 0}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.1)}
.dot.done{background:#C69C6D;opacity:0.5}
.dot.active{background:#C69C6D;box-shadow:0 0 0 4px rgba(198,156,109,0.2)}
/* scroll area */
.scroll{flex:1;overflow-y:auto;padding:0 20px}
/* history pairs */
.history{margin-bottom:16px}
.hist-item{border-left:1px solid rgba(255,255,255,0.06);padding:0 0 16px 16px;margin-left:8px}
.hist-label{font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:2px;margin-bottom:4px}
.hist-q{font-size:12px;color:rgba(255,255,255,0.25);line-height:1.5;margin-bottom:6px}
.hist-a{font-size:13px;color:rgba(255,255,255,0.4);line-height:1.6;background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:8px}
/* current card */
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:28px 24px 24px;margin-bottom:80px}
.card-label{font-size:11px;color:#C69C6D;letter-spacing:3px;margin-bottom:14px}
.card-question{font-size:18px;color:#FDFBF7;line-height:1.8;font-weight:500;margin-bottom:24px}
.card-input{width:100%;background:rgba(255,255,255,0.05);border:none;border-radius:12px;padding:14px 16px;color:#FDFBF7;font-size:14px;outline:none;font-family:inherit;line-height:1.7;min-height:100px;resize:none;margin-bottom:20px}
.card-input::placeholder{color:rgba(255,255,255,0.15)}
.card-actions{display:flex;justify-content:flex-end;gap:12px}
.btn-skip{background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.35);padding:10px 24px;border-radius:20px;font-size:13px;cursor:pointer}
.btn-next{background:linear-gradient(135deg,#C69C6D,#B8885A);border:none;color:#fff;padding:10px 28px;border-radius:20px;font-size:13px;cursor:pointer}
/* instant flash indicator */
.instant-badge{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.instant-badge-icon{font-size:14px}
.instant-badge-text{font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:1px}
</style></head>
<body><div class="phone">
<div class="nav">
<span class="nav-back">← 返回</span>
<span class="nav-title">一次觉察</span>
<span class="nav-step">3/8</span>
</div>
<div class="progress">
<span class="dot done"></span><span class="dot done"></span><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
</div>
<div class="scroll">
  <div class="history">
    <div class="hist-item">
      <div class="hist-label">渡渡</div>
      <div class="hist-q">此刻有什么想说的吗？你现在感觉怎么样？</div>
      <div class="hist-a">今天开会又被领导批评了，心里很难受。</div>
    </div>
    <div class="hist-item">
      <div class="hist-label">渡渡</div>
      <div class="hist-q">我听到了。那种"又被批评"的感觉，让你想到什么？</div>
      <div class="hist-a">觉得自己很差劲，什么都做不好。</div>
    </div>
  </div>
  <div class="card">
    <div class="instant-badge">
      <span class="instant-badge-icon">⚡</span>
      <span class="instant-badge-text">即时生成</span>
    </div>
    <div class="card-label">渡渡</div>
    <div class="card-question">我感受到了。你说"什么都做不好"的时候，身体有什么感觉吗？</div>
    <textarea class="card-input" placeholder="写下你的回答...">胸口闷闷的，像有东西压着。</textarea>
    <div class="card-actions">
      <button class="btn-skip">跳过</button>
      <button class="btn-next">继续 →</button>
    </div>
  </div>
</div>
</div></body></html>
